[project]
name = "starter-progetto-frattali-u20"
version = "0.1.0"
description = "Starter del Laboratorio dei frattali: package, configurazioni di esempio, test pubblici e documentazione iniziale (Unità 20, progetto autonomo)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "frattali",
]
