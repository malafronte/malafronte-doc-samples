[project]
name = "esempi-unita-17"
version = "0.1.0"
description = "Alberi binari, alberi binari di ricerca e indice di record verificati dell'Unità 17."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["esempi", "soluzioni", "laboratorio"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["*_u17", "indice_bst_starter"]
