[project]
name = "esempi-unita-16"
version = "0.1.0"
description = "Array dinamici, liste concatenate, pile e code verificate dell'Unità 16."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["esempi", "soluzioni", "laboratorio"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["*_u16", "lista_coda_starter"]
