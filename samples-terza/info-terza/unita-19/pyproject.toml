[project]
name = "esempi-unita-19"
version = "0.1.0"
description = "B-tree didattici con grado minimo, simulazioni verificate e confronto fra strutture di ricerca dell'Unità 19."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["esempi", "soluzioni", "laboratorio"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["*_u19", "ricerca_btree_starter", "dati_catalogo", "confronto_starter"]
